<script>
const rawData = [
  {ch:1, q:"1. 管理者是在組織中和一群人工作，藉由協調他人，來完成任務和達成組織目標的人。", a:true, diff:"easy"},
  {ch:1, q:"2. 組織是將一群人有系統地組合在一起，以達成特定的目標。", a:true, diff:"easy"},
  {ch:1, q:"3. 組織的特性包括了資本、成員及組織結構，唯有擁有這三種特性，才能成為組織。", a:false, diff:"moderate"},
  {ch:1, q:"4. 組織所欲達成的目的我們稱之為組織目標。", a:true, diff:"easy"},
  {ch:1, q:"5. 基層員工除了要執行本身的工作之外，還必須負起監督其他人工作的責任。", a:false, diff:"easy"},
  {ch:1, q:"6. 中階管理者的主要工作是監督員工每天的作業活動。他經常是一個工作群體的領導者，實際參與工作的執行。", a:false, diff:"moderate"},
  {ch:1, q:"7. 管理者一般可區分為第一線管理者、中階管理者及高階管理者。", a:true, diff:"easy"},
  {ch:1, q:"8. 管理就是協調工作活動的過程，並且透過與他人的努力，既有效率且有效能的把事情做好。", a:true, diff:"easy"},
  {ch:1, q:"9. 過程(process)是管理者所執行的管理功能，一般是指規劃、命令、領導及控制。", a:false, diff:"moderate"},
  {ch:1, q:"10. 所謂效率就是指作對的事情(do the right things)。", a:false, diff:"moderate"},
  {ch:2, q:"1. 亞當‧史密斯在《科學管理的原則》一書中，對於藉由分工提升組織與經濟的優勢提出了精闢的見解。", a:false, diff:"moderate"},
  {ch:2, q:"2. 工業革命的興起，造成動力機器取代了人力。", a:true, diff:"easy"},
  {ch:2, q:"3. 泰勒(Frederick Taylor)運用了管理科學原則的開創性研究，使他被尊稱為「管理科學之父」。", a:false, diff:"moderate"},
  {ch:2, q:"4. 《科學管理的原則》(The principles of Scientific Management)是泰勒(Frederick Taylor)所寫的一本對於管理學後續的發展影響即為深遠的書。", a:true, diff:"easy"},
  {ch:2, q:"5. 甘特(Henry Gantt)對於薪資體系的看法，認為利用「按件計酬」的方式最能給予工作者安全的支柱，並可增加其士氣及產量。", a:false, diff:"moderate"},
  {ch:2, q:"6. 吉爾伯斯(Frank Gilbreth)對於管理思想最大的貢獻就是「動作科學」研究。", a:true, diff:"easy"},
  {ch:2, q:"7. 吉爾伯斯(Frank Gilbreth)有「效率主教」(high priest of efficiency)之稱，並著有《效率的十二原則》(The Twelve Principles of Efficiency)。", a:false, diff:"moderate"},
  {ch:2, q:"8. 吉爾伯斯夫婦藉由分析工人手部的動作，分解出十七項的分解動作，稱之為「動素」(therblig)。分析動素的目的是要找出一套「最佳方法」。", a:true, diff:"easy"},
  {ch:2, q:"9. 科學化的管理遭受到許多的批評，因為許多經理人只不過將科學化的管理當做是提昇效率的工具，工人成了命令的接受者，變成不需要思考的機器。", a:true, diff:"easy"},
  {ch:2, q:"10. 行政理論又稱為程序學派，其所關心的是個別工人的工作效率。", a:false, diff:"moderate"},
  {ch:3, q:"1. 企業所面臨的環境，最大的特色就是不確定性或一定程度的不可預測性。", a:true, diff:"easy"},
  {ch:3, q:"2. 企業只需將自己的能力提升就好，環境對的企業的影響與否並不重要。", a:false, diff:"easy"},
  {ch:3, q:"3. 套利(arbitrage)或是避險(hedging)策略都是企業可以用來降低環境的不確定的方法。", a:true, diff:"easy"},
  {ch:3, q:"4. 企業愈能準確的預測環境波動情形，愈能降低外部環境之不確定性。", a:true, diff:"easy"},
  {ch:3, q:"5. 全球化、自由化、國際化等是近年來全球環境所發生的重大變革。", a:true, diff:"easy"},
  {ch:3, q:"6. 在全球化的推波助瀾下，使得全世界財富的分配愈來愈平均，人民生活水準也愈來愈高。", a:false, diff:"moderate"},
  {ch:3, q:"7. 國家與國家之間的依賴程度是很低的，每個國家的經濟發展僅受限於自身的經濟狀況，而不會受到其他國家的影響。", a:false, diff:"easy"},
  {ch:3, q:"8. 像歐盟(EU)或是北美自由貿易協定(NAFTA)等組織的設立，目的是要加強區域貿易及合作的關係。", a:true, diff:"easy"},
  {ch:3, q:"9. 雙邊自由貿易協定(FTA)是目前全球環境的一個趨勢。", a:true, diff:"moderate"},
  {ch:3, q:"10. 舉凡國家的經濟體系、經濟發展階段及匯率變化都是企業所面臨之全球環境的變數。", a:false, diff:"easy"},
  {ch:5, q:"1. 決策(decision)是指在兩個或兩個以上的替代方案中作抉擇。", a:true, diff:"easy"},
  {ch:5, q:"2. 現在模式是指個人或組織應遵行的步驟，以求提升決策符合邏輯與最適化的可能性。", a:false, diff:"easy"},
  {ch:5, q:"3. 理性模式又被稱為古典模式(classical model)。", a:true, diff:"easy"},
  {ch:5, q:"4. 理性模式的前提假設是決策者的決策會符合個人的最大經濟利益。", a:false, diff:"moderate"},
  {ch:5, q:"5. 決策的程序始於確認決策準則。", a:false, diff:"easy"},
  {ch:5, q:"6. 決策者除了瞭解事物現狀與渴望狀態間的差距之外，也必須找出造成差距的原因。", a:true, diff:"easy"},
  {ch:5, q:"7. 經理人會將所有的問題，都視為問題而試圖去解決。", a:false, diff:"moderate"},
  {ch:5, q:"8. 決策準則的選擇僅和組織特性有關，與決策者的偏好無關。", a:false, diff:"easy"},
  {ch:5, q:"9. 所謂高度結構化問題，是指決策者對問題相當熟悉，可輕易地蒐集資訊與達成目標。", a:true, diff:"easy"},
  {ch:5, q:"10. 許多公司會針對低度結構化問題，建立一套標準作業程序(Standard Operation Process; SOP)。", a:false, diff:"easy"},
  {ch:5, q:"11. 程式化決策指的是重複與例行性的決策，並且有事先制訂好的程序、規則或政策可以讓執行者快速地解決問題。", a:true, diff:"easy"},
  {ch:5, q:"12. 政策是指以直接或明文之方式，告知組織成員何者應為與何者不應為。", a:false, diff:"moderate"},
  {ch:5, q:"13. 某家銀行規定新台幣500萬元以下的放款是屬於分行經理權限，而新台幣500萬元以上是屬於區域經理的權限，此為對’程序’的說明。", a:false, diff:"difficult"},
  {ch:5, q:"14. 高度結構化問題是指很少出現之新問題。", a:false, diff:"easy"},
  {ch:5, q:"15. 高階管理者所面臨之問題，大多較屬於程式化決策模式。", a:false, diff:"easy"},
  {ch:5, q:"16. 非程式化決策指的是問題具備複雜性與新奇性，因此所需要的是創造性的問題解決。決策者必須依人、事、時、地、物之不同，擬訂定出最適切的因應方案。", a:true, diff:"easy"},
  {ch:5, q:"17. 在現實世界裡，經理人所面臨的往往都是確定性決策情境。", a:false, diff:"easy"},
  {ch:5, q:"18. 樂觀的決策者總是會樂觀地思考與決策有關的事項，因此他們通常會選擇最大結果的最小化之替代方案。", a:false, diff:"easy"},
  {ch:5, q:"19. 悲觀的決策者通常採用極大極小準則。", a:true, diff:"easy"},
  {ch:5, q:"20. 最小悔恨的決策者，希望使得事後的悔恨最小化，也就是避免遠離最佳的決策。", a:true, diff:"easy"},
  {ch:5, q:"21. 賽局理論又被稱為兩人雙贏賽局。", a:true, diff:"easy"},
  {ch:5, q:"22. 「最大經濟效益」是一個可透過規劃即可達成的目標。", a:false, diff:"moderate"},
  {ch:5, q:"23. 「受限理性」是指決策者不可能分析所有可能替代方案的所有資訊，所以他只要找到令人滿意的結果即可。", a:true, diff:"easy"},
  {ch:5, q:"24. 受限理性的決策顯示其只是經過決策者簡化決策程序後的最佳選擇。", a:true, diff:"moderate"},
  {ch:5, q:"25. 擴大承諾是指在已有證據顯示先前的決策是正確的情況下，決策者因此不斷增加承諾。", a:false, diff:"moderate"},
  {ch:5, q:"26. 直覺式策略做成(intuitive decision making)係指決策者潛意識地使用經驗與累積判斷進行決策的過程。", a:true, diff:"easy"},
  {ch:5, q:"27. 行為型的決策者在解決問題上傾向於有效率、符合邏輯、務實與系統化。", a:false, diff:"moderate"},
  {ch:5, q:"28. 指引型的決策者會傾向於獨裁、展現權力與控制，並且注重短期的成效。", a:true, diff:"moderate"},
  {ch:5, q:"29. 過去的研究指出，大部分的經理人都是僅屬於某一種決策風格。", a:false, diff:"easy"},
  {ch:5, q:"30. 若是僅考量效率，最有效率的組織決策，通常是以非程式化的方式達成。", a:false, diff:"easy"},
  {ch:6, q:"1. 正式規劃常令組織成員沒有充分參與決策與規劃的機會，有可能會降低組織學習的成效，甚至降低組織成員的向心力。", a:false, diff:"difficult"},
  {ch:6, q:"2. 非正式規劃會以具結構性與步驟性的方式展現。", a:false, diff:"easy"},
  {ch:6, q:"3. 完整的計畫可協助經理人控制組織的活動。", a:true, diff:"difficult"},
  {ch:6, q:"4. 適當與深入的規劃會比涵蓋面過於廣泛的規劃有更高的績效表現。", a:true, diff:"moderate"},
  {ch:6, q:"5. 目標可以是只具方向性的，也可以是十分具體地指出所要達到的成果。", a:true, diff:"moderate"},
  {ch:6, q:"6. 組織真實的目標(real goals)是指組織公開宣示要達成的目標。", a:false, diff:"moderate"},
  {ch:6, q:"7. 企業經理人為滿足大眾需求所做的公開陳述，而非企業真實且準備努力達成的目標稱之為正式目標(stated goals)。", a:true, diff:"easy"},
  {ch:6, q:"8. 組織的真實目標(real goals)是指組織成員真心追求並將全力達成的目標。", a:true, diff:"easy"},
  {ch:6, q:"9. 作業計畫(operational plans)通常由較高的管理階層的經理人來執行。", a:false, diff:"moderate"},
  {ch:6, q:"10. 策略計畫通常屬於長期且涵蓋面較為廣泛的計畫，甚至會界定各個作業計畫的目標，以作為擬定作業計畫時的參考。", a:true, diff:"moderate"},
  {ch:6, q:"11. 為因應企業目標，而擬定詳細的執行計畫，稱之為作業計畫。", a:true, diff:"easy"},
  {ch:6, q:"12. 指引性計畫(directional plans)是指，企業為滿足計畫目標，而詳細規劃執行步驟與時程。", a:false, diff:"difficult"},
  {ch:6, q:"13. 單一用途計畫(single-use plan)是指該計畫只被運用於特定情況。", a:true, diff:"moderate"},
  {ch:6, q:"14. 經常性計畫(standing plans)是指可以在例行性或具有重複性的日常業務中做為指導方針。", a:true, diff:"moderate"},
  {ch:6, q:"15. 為了達成規劃的效果，經理人必需與執行者溝通，使規劃結果可以執行。", a:true, diff:"moderate"},
  {ch:6, q:"16. 傳統目標建立(traditional goal setting) 的方式，是由下而上設定目標。", a:false, diff:"difficult"},
  {ch:6, q:"17. 目標管理(Management by Objectives, MBO)的基本理念即是希望納入組織各階層的意見，以擬定各層級與組織目標，並定期檢視執行績效與獎勵。目標管理使員工較傳統的目標建立方式更有積極參與的動機與成就感。", a:true, diff:"moderate"},
  {ch:6, q:"18. 在變動快速的環境中，規畫只是浪費時間。", a:false, diff:"moderate"},

  {ch:6, q:"20. 目標管理是一項非常有效的管理工具，沒有任何的問題。", a:false, diff:"moderate"},
  {ch:6, q:"21. 機械式組織與不鼓勵參與的價值觀常常危害到目標管理的過程。", a:true, diff:"moderate"},
  {ch:6, q:"22. 一個設計良好的目標必須與報酬系統相連結。", a:true, diff:"easy"},
  {ch:6, q:"23. 一個好的目標必須能訴諸於文字的結果，但不一定是可量測或量化。", a:false, diff:"difficult"},
  {ch:6, q:"24. 目標必須具有挑戰性，但也必須是可完成的。", a:true, diff:"easy"},
  {ch:6, q:"25. 根據本文的描述，發展計畫的過程，會受到組織層級及環境不確定程度等兩種因素的影響。", a:false, diff:"difficult"},
  {ch:6, q:"26. 『承諾』的概念是指企業實際計畫所涵蓋的時間長度，必須符合計畫發展當初所做的承諾。", a:true, diff:"easy"},
  {ch:6, q:"27. 環境不確定性會影響計畫的品質與效能。為因應環境不確定性的逐漸提高，計畫必須維持更高的專屬性與彈性。", a:true, diff:"easy"},

let currentQuestions = [...rawData];
let currentIndex = 0;
let score = 0;
let totalAnswered = 0;
let answered = false;

function loadQuestion() {
  answered = false;
  const q = currentQuestions[currentIndex];
  document.getElementById('qTag').innerText = `第 ${q.ch} 章 | 難易度: ${q.diff}`;
  document.getElementById('qTitle').innerText = q.q;
  
  const expBox = document.getElementById('expBox');
  expBox.className = 'explanation';
  expBox.innerText = '';
  
  document.getElementById('btnTrue').className = 'btn-option';
  document.getElementById('btnFalse').className = 'btn-option';
}

function checkAnswer(userAns) {
  if (answered) return;
  answered = true;
  totalAnswered++;
  
  const q = currentQuestions[currentIndex];
  const isCorrect = (userAns === q.a);
  
  if (isCorrect) score++;

  const expBox = document.getElementById('expBox');
  expBox.innerText = isCorrect ? "🎉 回答正確！" : `❌ 回答錯誤！正確答案為：${q.a ? 'O (True)' : 'X (False)'}`;
  expBox.className = `explanation ${isCorrect ? 'show-correct' : 'show-wrong'}`;

  if (q.a === true) {
    document.getElementById('btnTrue').classList.add('correct');
    if (!isCorrect) document.getElementById('btnFalse').classList.add('wrong');
  } else {
    document.getElementById('btnFalse').classList.add('correct');
    if (!isCorrect) document.getElementById('btnTrue').classList.add('wrong');
  }

  document.getElementById('score').innerText = `${score}/${totalAnswered} (${Math.round((score/totalAnswered)*100)}%)`;
}

function nextQuestion() {
  if (currentIndex < currentQuestions.length - 1) {
    currentIndex++;
    loadQuestion();
  } else {
    alert("已經是最後一題了！");
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    loadQuestion();
  }
}

function filterQuestions() {
  const ch = document.getElementById('chapterSelect').value;
  if (ch === 'ALL') {
    currentQuestions = [...rawData];
  } else {
    currentQuestions = rawData.filter(q => q.ch == ch);
  }
  currentIndex = 0;
  loadQuestion();
}

window.onload = function() {
  loadQuestion();
};
</script>
